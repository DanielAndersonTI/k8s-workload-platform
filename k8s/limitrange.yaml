apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
  namespace: workloads
  labels:
    app.kubernetes.io/part-of: workload-platform
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
