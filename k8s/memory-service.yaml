apiVersion: v1
kind: Service
metadata:
  name: memory-workload
  namespace: workloads
  labels:
    app.kubernetes.io/name: memory-workload
    app.kubernetes.io/component: memory
    app.kubernetes.io/part-of: workload-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: memory-workload
  sessionAffinity: None
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
      nodePort: 30081
