apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cpu-workload
  namespace: workloads
  labels:
    app.kubernetes.io/name: cpu-workload
    app.kubernetes.io/part-of: workload-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cpu-workload
